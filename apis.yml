name: AdNectar
description: >-
  AdNectar was a social advertising startup founded in 2008 and headquartered in
  Palo Alto, California, that built a sponsored virtual-gifts network for Facebook
  applications and other social platforms. Its product let agencies and brands run
  campaigns in which consumers gave branded virtual gifts drawn from a catalog,
  paired with an embedded rich-media landing unit plus viral distribution,
  optimization, and reporting, so social-app publishers could monetize their
  virtual-goods inventory. The company raised roughly $5.3M from investors
  including Battery Ventures before being acqui-hired by Lockerz in November 2011.
  AdNectar is now defunct; its original adnectar.com domain is parked and serves no
  live product, developer portal, or public API. This profile is retained as a
  historical portfolio-lead record and is not an active API provider. Note that the
  unrelated adnectar.io (performance marketing) and addnectar.com (Addnectar
  Solutions) are separate companies and are not associated with this entity.
